# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-variscite-lab"
BBFILE_PATTERN_meta-variscite-lab = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-variscite-lab = "20"

LAYERDEPENDS_meta-variscite-lab = "core"
LAYERSERIES_COMPAT_meta-variscite-lab = "scarthgap"
